---
header:
  version: 11
machine: raspberrypi0-2w
distro: bah
repos:
  meta-bah:
    path: meta-bah
  poky:
    url: https://github.com/yoctoproject/poky
    commit: 8643f911602949518c5c5474726b49f943e36b83
    path: layers/poky
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:
  meta-swupdate:
    url: https://github.com/sbabic/meta-swupdate
    commit: 438e8ea2d98aa5fd5f571f84db154dbe9062b37a
    path: layers/meta-swupdate
  meta-openembedded:
    url:  https://github.com/openembedded/meta-openembedded
    commit: 1ad0d777d1de1769e5995eb806f7ae5c15d0be54
    path: layers/meta-openembedded
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-multimedia:
  meta-raspberrypi:
    url: https://github.com/agherzan/meta-raspberrypi
    commit: 2c646d29912dcc873469a57b1c207e1549c5094d
    path: layers/meta-raspberrypi
  meta-lts-mixins:
    url: https://github.com/nedap/meta-lts-mixins
    commit: 65c51abe3871d50e599366765838d1478eba093e
    path: layers/meta-lts-mixins
env:
  SSTATE_DIR: /hdd/yocto/sstate-cache
  DL_DIR: /hdd/yocto/bb-downloads
  WIFI_SSID: null
  WIFI_PASSWORD: null
local_conf_header:
  licenses: |
    LICENSE_FLAGS_ACCEPTED:append = " commercial commercial_ffmpeg"
  rm-work-conf: |
    INHERIT += "rm_work"
  bah-parameters: |
    BAH_SERVER_ADDRESS = "172.24.0.100"
    BAH_SERVER_PATH = "/bah"
    BAH_MOUNT_PATH = "/mnt"
    BAH_SERVER_USERNAME = "bah"
    BAH_SERVER_PASSWORD = "bah"
  version_pinning: |
    PREFERRED_VERSION_libgpiod = "1.6.5"
    RUST_CHANNEL = "nightly"
  custom-overlays: |
    KERNEL_DEVICETREE:append = " overlays/rpi-codeczero.dtbo"
  passthrough: |
    BB_ENV_PASSTHROUGH_ADDITIONS += "WIFI_SSID WIFI_PASSWORD"
  graphics: |
    VC4DTBO = "vc4-fkms-v3d,noaudio"
  swupdate: |
    WIC_CREATE_EXTRA_ARGS = "--no-fstab-update"
    IMAGE_FSTYPES = "wic.bz2 wic.bmap ext4.gz"
    PREFERRED_PROVIDER_u-boot-fw-utils = "libubootenv"
    RPI_USE_U_BOOT = "1"
  disk: |
    DATA_PART_UUID = "ec67a5b5-00d9-4388-89ac-8a71d5ab3fea"
